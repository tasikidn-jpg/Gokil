[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gokil-agent"
version = "0.1.0"
description = "Gokil — an autonomous, tool-using AI agent with a rich terminal UI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Gokil" }]
keywords = ["ai", "agent", "llm", "react", "tools", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=6.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
gokil = "gokil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
